<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D5 scroll-linked test</title>
<style>
html,body{margin:0;background:#000;color:#eee;font:16px/1.4 -apple-system,system-ui}
.pad{height:60svh;display:flex;align-items:center;justify-content:center;color:#888;text-align:center;padding:0 16px}
.track{height:400svh;position:relative;view-timeline:--t}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;border-radius:12px;background:#0b1a26}
.lane{position:absolute;top:12svh;bottom:12svh;width:30%;display:flex;flex-direction:column;align-items:center}
.lane b{font-size:13px;color:#9cf;margin-bottom:8px;text-align:center}
.a{left:2%}.b{left:35%}.c{left:68%}
.dot{width:56px;height:56px;border-radius:50%;background:#ff2d55}
.b .dot{background:#34c759;animation:mv linear both;animation-timeline:--t;animation-range:contain 0% contain 100%}
@keyframes mv{from{translate:0 0}to{translate:0 55svh}}
.c .dot{background:#ffcc00;transition:translate .5s cubic-bezier(.3,.7,.2,1)}
.c .dot.on{translate:0 55svh}
</style></head><body>
<div class="pad">D5. Scroll down slowly by hand through the blue box. Three dots move as you scroll:<br>red = moved by JavaScript each frame (how the shows work now)<br>green = moved by CSS tied to scroll<br>yellow = CSS animation started at the halfway point</div>
<div class="track" id="t"><div class="stage">
<div class="lane a"><b>JS</b><div class="dot" id="r"></div></div>
<div class="lane b"><b>CSS scroll</b><div class="dot"></div></div>
<div class="lane c"><b>Trigger</b><div class="dot" id="y"></div></div>
</div></div>
<div class="pad">End. Which dot felt smooth?</div>
<script>
(function(){var t=document.getElementById('t'),r=document.getElementById('r'),y=document.getElementById('y'),tick=0;
function f(){tick=0;var b=t.getBoundingClientRect(),h=innerHeight,p=Math.min(1,Math.max(0,-b.top/(b.height-h)));r.style.transform='translateY('+(p*0.55*h).toFixed(1)+'px)';y.classList.toggle('on',p>.5);}
addEventListener('scroll',function(){if(!tick)tick=requestAnimationFrame(f)},{passive:true});f();})();
</script></body></html>
