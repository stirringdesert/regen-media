<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex"><title>Tilt</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#b{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);font:600 15px/1 system-ui,sans-serif;color:#106EA8;background:#fff;border:2px solid #106EA8;border-radius:99px;padding:12px 20px}
</style></head><body>
<canvas id="c"></canvas>
<button id="b" hidden>Включить наклон</button>
<script>
const B='#106EA8',c=document.getElementById('c'),x=c.getContext('2d'),btn=document.getElementById('b');
let W,H,D,F;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;
 F={x:W*.2,y:H*.62,w:W*.6,h:Math.max(36,H*.07)}}
size();addEventListener('resize',size);
// shapes: t = 0 circle, 1 square, 2 triangle (all collide as circles)
const S=[];const R=Math.max(18,Math.min(W,H)*.06);
for(let i=0;i<9;i++){const r=R*(.7+Math.random()*.5);S.push({x:W*.2+Math.random()*W*.6,y:H*.1+Math.random()*H*.3,vx:0,vy:0,r,t:i%3,a:Math.random()*6,va:0})}
let gx=0,gy=1,tx=0,ty=1,sensors=false;
function onO(e){if(e.gamma==null)return;sensors=true;
 const o=(screen.orientation&&screen.orientation.angle)||0;let a=e.gamma/90,b=e.beta/90;
 a=Math.max(-1,Math.min(1,a*1.6));b=Math.max(-1,Math.min(1,b*1.6));
 if(o===90){[a,b]=[b,-a]}else if(o===270||o===-90){[a,b]=[-b,a]}
 tx=a;ty=b}
function onM(e){const g=e.acceleration;if(!g||g.x==null)return;
 if(Math.hypot(g.x,g.y,g.z)>14)kick(14)}
function kick(p){for(const s of S){const a=Math.random()*6.283;s.vx+=Math.cos(a)*p*(.6+Math.random()*.8);s.vy+=Math.sin(a)*p*(.6+Math.random()*.8)-p*.5;s.va+=(Math.random()-.5)*.6}}
function listen(){addEventListener('deviceorientation',onO);addEventListener('devicemotion',onM)}
const needAsk=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
if(needAsk){btn.hidden=false;btn.onclick=async()=>{try{
  const r=await DeviceOrientationEvent.requestPermission();
  if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();
  if(r==='granted'){listen();btn.hidden=true}else btn.textContent='Доступ запрещён'}catch(e){btn.textContent='Ошибка: '+e.message}}}
else listen();
// mouse/touch fallback (desktop): pointer position sets gravity, click shakes
addEventListener('pointermove',e=>{if(sensors)return;tx=(e.clientX/W-.5)*2;ty=(e.clientY/H-.5)*2});
addEventListener('pointerdown',e=>{if(!sensors&&e.target!==btn)kick(12)});
function step(){
 gx+=(tx-gx)*.1;gy+=(ty-gy)*.1;const G=.55;
 for(const s of S){s.vx+=gx*G;s.vy+=gy*G;s.vx*=.995;s.vy*=.995;s.x+=s.vx;s.y+=s.vy;s.a+=s.va;s.va*=.98;
  if(s.x<s.r){s.x=s.r;s.vx*=-.5}if(s.x>W-s.r){s.x=W-s.r;s.vx*=-.5}
  if(s.y<s.r){s.y=s.r;s.vy*=-.5}if(s.y>H-s.r){s.y=H-s.r;s.vy*=-.5}
  // floor block (circle vs AABB)
  const cx=Math.max(F.x,Math.min(s.x,F.x+F.w)),cy=Math.max(F.y,Math.min(s.y,F.y+F.h));
  let dx=s.x-cx,dy=s.y-cy,d=Math.hypot(dx,dy);
  if(d<s.r){if(d===0){dy=-1;dx=0;d=1}const nx=dx/d,ny=dy/d;s.x=cx+nx*s.r;s.y=cy+ny*s.r;
   const v=s.vx*nx+s.vy*ny;if(v<0){s.vx-=1.5*v*nx;s.vy-=1.5*v*ny;s.va+=s.vx*.02}}}
 for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++){const p=S[i],q=S[j];
  let dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),m=p.r+q.r;
  if(d<m&&d>0){const nx=dx/d,ny=dy/d,o=(m-d)/2;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;
   const v=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;if(v<0){const j2=v*.75;p.vx+=j2*nx;p.vy+=j2*ny;q.vx-=j2*nx;q.vy-=j2*ny}}}
}
function draw(){
 x.setTransform(D,0,0,D,0,0);x.clearRect(0,0,W,H);x.strokeStyle=B;x.lineWidth=2.5;x.lineJoin='round';
 x.setLineDash([2,7]);x.lineCap='round';x.strokeRect(F.x,F.y,F.w,F.h);x.setLineDash([]);
 for(const s of S){x.save();x.translate(s.x,s.y);x.rotate(s.a);x.beginPath();
  if(s.t===0)x.arc(0,0,s.r,0,6.283);
  else if(s.t===1){const k=s.r*.85;x.roundRect(-k,-k,2*k,2*k,k*.2)}
  else{const k=s.r;x.moveTo(0,-k);x.lineTo(k*.95,k*.7);x.lineTo(-k*.95,k*.7);x.closePath()}
  x.stroke();x.restore()}}
(function loop(){step();draw();requestAnimationFrame(loop)})();
</script></body></html>
